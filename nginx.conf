server {
    listen 80;
    server_name _;

    # 1. 前端静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 支持 Vue/React Router History 模式
    }

    # 2. 上传文件读取
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
    }

    # 3. 后端 API 接口反向代理
    location /api/ {
        proxy_pass http://app:8001/; # app 为 docker-compose 中的 Koa 服务名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}